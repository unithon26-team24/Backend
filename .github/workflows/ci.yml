name: Backend PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared-integration-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect trusted Java metadata
        run: |
          stat -c 'toolchain uid=%u mode=%a type=%F' "$JAVA_HOME"
          stat -Lc 'java uid=%u mode=%a type=%F' "$JAVA_HOME/bin/java"
          printf 'runner uid=%s\n' "$(id -u)"
      - name: Run shared integration preflight contract tests
        run: bash ./scripts/test-verify-shared-integrations.sh

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Java checks
        run: ./gradlew check

  bolt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/slack-bolt/package-lock.json
      - name: Install Bolt dependencies
        run: npm --prefix apps/slack-bolt ci
      - name: Run Bolt tests
        run: npm --prefix apps/slack-bolt test
